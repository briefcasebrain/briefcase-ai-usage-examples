[project]
name = "criminal-evidence-poc"
version = "0.1.0"
description = "Briefcase AI SDK demo for criminal evidence summarization"
requires-python = ">=3.9"
dependencies = [
    "briefcase-ai>=3.2.0",
    "rouge-score>=0.1.2",
]

[project.optional-dependencies]
live = [
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "openai>=1.0.0",
    "anthropic>=0.25.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
