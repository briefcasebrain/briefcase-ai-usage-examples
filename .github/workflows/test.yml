name: Test SDK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 6 AM UTC
    - cron: '0 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      python: ${{ steps.changes.outputs.python }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/test.yml'
              - '.github/workflows/release.yml'
            python:
              - 'crates/**'
              - 'pyproject.toml'
              - 'tests/python/**'
              - '.github/workflows/test.yml'
            docs:
              - 'docs/**'
              - 'README.md'
              - '*.md'

  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check documentation
        run: cargo doc --all-features --no-deps

  test-rust:
    name: Test Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      - name: Run tests (all features)
        run: cargo test --all-features --verbose

      - name: Run tests (no default features)
        run: cargo test --no-default-features --verbose

      - name: Run tests (Python feature only)
        run: cargo test --no-default-features --features python --verbose

      - name: Run doctests
        run: cargo test --doc --all-features

  test-python:
    name: Test Python (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: python-test-${{ matrix.os }}-${{ matrix.python-version }}

      - name: Install maturin
        run: pip install maturin[patchelf]

      - name: Build Python wheel
        run: maturin develop

      - name: Test basic imports
        run: |
          python -c "import briefcase_ai_telemetry; print(f'Version: {briefcase_ai_telemetry.__version__}')"
          python -c "from briefcase_ai_telemetry import TelemetryClient, TelemetryConfig"
          python -c "from briefcase_ai_telemetry.cost import CostCalculator, estimate_cost"
          python -c "from briefcase_ai_telemetry.drift import calculate_drift_metrics"

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov

      - name: Run Python tests
        run: |
          pytest tests/python/ -v --cov=briefcase_ai_telemetry --cov-report=xml
        if: hashFiles('tests/python/**') != ''

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && hashFiles('coverage.xml') != ''
        with:
          file: ./coverage.xml
          flags: python

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install criterion
        run: cargo install cargo-criterion

      - name: Run benchmarks
        run: |
          if [ -d "benches" ]; then
            cargo bench --bench telemetry_benchmark
          else
            echo "No benchmarks found, skipping"
          fi

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        if: github.ref == 'refs/heads/main'
        with:
          name: Rust Benchmark
          tool: 'cargo'
          output-file-path: target/criterion/telemetry_benchmark/base/benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          log-level: warn
          command: check
          arguments: --all-features

  minimal-versions:
    name: Test Minimal Versions
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: minimal-versions

      - name: Install cargo-hack and cargo-minimal-versions
        run: |
          cargo install cargo-hack cargo-minimal-versions

      - name: Check minimal versions
        run: cargo minimal-versions check --all-features

  cross-compile:
    name: Cross Compilation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}

      - name: Install cross
        run: cargo install cross

      - name: Cross compile
        run: cross build --target ${{ matrix.target }} --no-default-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: |
          cargo doc --all-features --no-deps

      - name: Check documentation links
        run: |
          # Install markdown link checker
          cargo install markdown-link-check || echo "markdown-link-check not available"

          # Check README links
          if command -v markdown-link-check &> /dev/null; then
            find . -name "*.md" -not -path "./target/*" -not -path "./venv/*" | xargs -I {} markdown-link-check {}
          fi

      - name: Deploy docs to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc

  test-examples:
    name: Test Examples
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' && hashFiles('examples/**') != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Test examples compile
        run: |
          for example in examples/*.rs; do
            if [ -f "$example" ]; then
              echo "Testing example: $example"
              cargo check --example "$(basename "$example" .rs)"
            fi
          done

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [test-rust, test-python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage report
        run: |
          cargo tarpaulin --verbose --all-features --workspace --timeout 120 --out xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: cobertura.xml
          flags: rust

  check-status:
    name: Check Overall Status
    runs-on: ubuntu-latest
    needs: [lint, test-rust, test-python, security, docs]
    if: always()
    steps:
      - name: Check status
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" ||
                "${{ needs.test-rust.result }}" == "failure" ||
                "${{ needs.test-python.result }}" == "failure" ||
                "${{ needs.security.result }}" == "failure" ]]; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed"
          fi