name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-rust:
    name: Test Rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Verify Rust installation
      run: |
        rustc --version
        cargo --version

    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check workspace structure (Unix)
      if: runner.os != 'Windows'
      run: |
        ls -la
        cat Cargo.toml
        ls -la crates/

    - name: Check workspace structure (Windows)
      if: runner.os == 'Windows'
      run: |
        dir
        type Cargo.toml
        dir crates\

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run Clippy (no features)
      run: cargo clippy --all-targets --no-default-features -- -D warnings

    - name: Run Clippy (all features)
      run: cargo clippy --all-targets --all-features -- -D warnings
      continue-on-error: true

    - name: Run tests (no default features)
      run: cargo test --verbose --no-default-features

    - name: Run tests (all features)
      run: cargo test --verbose --all-features
      continue-on-error: true

  test-python:
    name: Test Python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache pip (Unix)
      if: runner.os != 'Windows'
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache pip (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          python -m pip install maturin pytest pytest-asyncio
        else
          python -m pip install maturin[patchelf] pytest pytest-asyncio
        fi
      shell: bash

    - name: Build Python package
      shell: bash
      run: |
        echo "📦 Building Python package with maturin..."
        python -m venv .venv
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          source .venv/Scripts/activate
        else
          source .venv/bin/activate
        fi
        python -m pip install --upgrade pip
        maturin develop --release --manifest-path crates/briefcase-ai-telemetry/Cargo.toml
      continue-on-error: false

    - name: Run Python tests
      shell: bash
      run: |
        if [ -d "python/tests" ]; then
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          # Check if the Rust extension was built successfully
          if python -c "import briefcase_ai_telemetry._internal" 2>/dev/null; then
            python -m pytest python/tests/ -v
          else
            echo "⚠️ Rust extension not available, skipping tests"
            exit 0
          fi
        else
          echo "No tests directory found, skipping tests"
        fi
      continue-on-error: true

  build-wheels:
    name: Build wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        args: --release --out dist --find-interpreter
        sccache: 'true'
        manylinux: auto
      continue-on-error: true

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      if: always() && hashFiles('dist/*') != ''
      with:
        name: wheels-${{ matrix.os }}
        path: dist

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-audit
      run: cargo install cargo-audit
    - name: Run cargo audit
      run: cargo audit
      continue-on-error: true

  # dependency-review:
  #   name: Dependency Review
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 10
  #   if: github.event_name == 'pull_request'
  #   permissions:
  #     contents: read
  #     pull-requests: write
  #   steps:
  #   - name: Checkout Repository
  #     uses: actions/checkout@v4
  #   - name: Dependency Review
  #     uses: actions/dependency-review-action@v4
  #     with:
  #       fail-on-severity: moderate

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install black isort ruff mypy
    - name: Run black
      run: black --check python/
    - name: Run isort
      run: isort --check-only python/
    - name: Run ruff
      run: ruff check python/
    - name: Run mypy
      run: mypy python/briefcase_ai_telemetry/ --ignore-missing-imports

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install maturin pytest pytest-cov
    - name: Build package
      shell: bash
      run: |
        echo "📦 Building package for coverage..."
        python -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip
        maturin develop --release --manifest-path crates/briefcase-ai-telemetry/Cargo.toml
      continue-on-error: false
    - name: Run tests with coverage
      shell: bash
      run: |
        if [ -d "python/tests" ]; then
          source .venv/bin/activate
          python -m pip install pytest pytest-cov
          # Check if the Rust extension was built successfully
          if python -c "import briefcase_ai_telemetry._internal" 2>/dev/null; then
            python -m pytest python/tests/ --cov=briefcase_ai_telemetry --cov-report=xml
          else
            echo "⚠️ Rust extension not available, skipping coverage"
            # Create empty coverage file to avoid upload errors
            echo '<?xml version="1.0" ?><coverage></coverage>' > coverage.xml
            exit 0
          fi
        else
          echo "No tests directory found, skipping coverage"
        fi
      continue-on-error: true
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: always() && hashFiles('coverage.xml') != ''
      with:
        file: ./coverage.xml
        flags: python
        name: python-coverage