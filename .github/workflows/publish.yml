name: Build and Publish to Private Registry

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  packages: write  # For GitHub Packages

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-apple-darwin, aarch64-apple-darwin, x86_64-pc-windows-msvc]
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install dependencies
      run: pip install maturin

    - name: Build wheels
      run: maturin build --release --target ${{ matrix.target }} --strip

    - name: Upload wheels as artifacts
      uses: actions/upload-artifact@v3
      with:
        name: wheels-${{ matrix.target }}
        path: target/wheels/*.whl

  publish-github-packages:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download all wheel artifacts
      uses: actions/download-artifact@v3
      with:
        path: wheels

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install twine
      run: pip install twine

    - name: Publish to GitHub Packages
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        TWINE_REPOSITORY_URL: https://upload.pypi.org/legacy/  # Will be configured for private registry
      run: |
        # Flatten wheel directory structure
        mkdir -p dist
        find wheels -name "*.whl" -exec cp {} dist/ \;

        # Note: Configure your private registry URL in repository secrets
        # For now, this will need manual configuration
        echo "Wheels built and ready for private registry upload"
        echo "Configure PRIVATE_REGISTRY_URL and credentials in secrets"
        ls -la dist/

  create-release-assets:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
    - name: Download all wheel artifacts
      uses: actions/download-artifact@v3
      with:
        path: wheels

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        find wheels -name "*.whl" -exec cp {} release-assets/ \;

        # Create installation instructions
        cat > release-assets/INSTALL.md << 'EOF'
        # Private Installation Instructions

        ## Prerequisites
        - Valid license agreement with Briefcase AI
        - Python 3.8+ with pip

        ## Installation from wheel
        ```bash
        pip install briefcase_ai_telemetry-*.whl
        ```

        ## Verify installation
        ```python
        import briefcase_ai_telemetry
        print("Installation successful!")
        ```

        For support, contact: support@briefcasebrain.com
        EOF

    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release-assets/*.whl
          release-assets/INSTALL.md
        body: |
          ## Briefcase AI Telemetry SDK - Private Release

          **License**: Business Source License 1.1
          **Distribution**: Private registry only

          ### Installation
          Download the appropriate wheel for your platform and install with pip.
          See INSTALL.md for detailed instructions.

          ### License Agreement
          By downloading and using this software, you agree to the BSL 1.1 license terms.
          Commercial licenses available for service providers.

          Contact: support@briefcasebrain.com