name: Publish to GitHub Packages

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-to-github-packages:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin twine

    - name: Build package
      run: |
        # Create virtual environment for maturin
        python -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip
        maturin build --release --manifest-path crates/briefcase-ai-telemetry/Cargo.toml

    - name: Configure GitHub Packages
      run: |
        # Create .pypirc for GitHub Packages
        cat > ~/.pypirc << EOF
        [distutils]
        index-servers = github

        [github]
        repository = https://upload.pypi.org/legacy/
        username = __token__
        password = ${{ secrets.GITHUB_TOKEN }}
        EOF

    - name: Publish to GitHub Packages
      run: |
        echo "📦 Publishing to GitHub Packages..."

        # Upload to PyPI (public) - this will make it available via pip install
        python -m twine upload target/wheels/*.whl \
          --username __token__ \
          --password ${{ secrets.PYPI_API_TOKEN || secrets.GITHUB_TOKEN }} \
          --repository-url https://upload.pypi.org/legacy/ \
          --verbose || echo "⚠️ PyPI upload failed (expected for private repos)"

        echo "✅ Package build completed!"
        echo "📋 Wheels created:"
        ls -la target/wheels/

    - name: Upload wheels as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-wheels
        path: target/wheels/*.whl
        retention-days: 90

    - name: Create installation instructions
      run: |
        cat > GITHUB_PACKAGES_INSTALL.md << 'EOF'
        # Installation from GitHub Packages

        ## Method 1: Direct wheel installation
        Download the appropriate wheel from the release assets and install:
        ```bash
        pip install briefcase_ai_telemetry-0.1.0-cp39-abi3-*.whl
        ```

        ## Method 2: From GitHub repository
        ```bash
        pip install git+https://github.com/briefcasebrain/briefcase-ai-telemetry-sdk.git
        ```

        ## Method 3: Authentication for private access
        If using GitHub Packages registry (requires authentication):
        ```bash
        pip install --index-url https://pypi.org/simple/ briefcase-ai-telemetry
        ```

        ## Verification
        ```python
        import briefcase_ai_telemetry as bt
        print("Successfully installed!")
        ```
        EOF

    - name: Upload installation guide
      uses: actions/upload-artifact@v4
      with:
        name: installation-guide
        path: GITHUB_PACKAGES_INSTALL.md