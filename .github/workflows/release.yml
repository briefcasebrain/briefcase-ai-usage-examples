name: Release SDK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "Releasing version: ${VERSION#v}"

      - name: Validate version format
        run: |
          if ! [[ "${{ steps.version.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Invalid version format: ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check version consistency
        run: |
          CARGO_VERSION=$(grep '^version =' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [[ "$CARGO_VERSION" != "${{ steps.version.outputs.version }}" ]]; then
            echo "Version mismatch: Cargo.toml has $CARGO_VERSION, tag has ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Run tests
        run: |
          cargo test --all-features
          cargo test --no-default-features

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

  test-python:
    name: Test Python Bindings
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ matrix.os }}-${{ matrix.python-version }}

      - name: Install maturin
        run: pip install maturin

      - name: Build Python wheel
        shell: bash
        run: |
          python -m venv .venv
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          python -m pip install --upgrade pip
          maturin develop --release --manifest-path crates/briefcase-ai-telemetry/Cargo.toml

      - name: Test Python bindings
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          python -c "import briefcase_ai_telemetry; print('Import successful')" || echo "⚠️ Import test skipped - extension may not be built"

  build-wheels:
    name: Build Python Wheels
    runs-on: ${{ matrix.os }}
    needs: [validate, test-python]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        target: [x86_64, aarch64]
        exclude:
          - os: windows-latest
            target: aarch64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  build-sdist:
    name: Build Python Source Distribution
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install maturin
        run: pip install maturin

      - name: Build source distribution
        run: maturin sdist --out dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  build-binaries:
    name: Build CLI Binaries
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact-name: briefcase-ai-telemetry-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact-name: briefcase-ai-telemetry-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact-name: briefcase-ai-telemetry-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-name: briefcase-ai-telemetry-windows-amd64.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: binary-${{ matrix.target }}

      - name: Build binary
        run: |
          cargo build --release --target ${{ matrix.target }} --features cli --bin briefcase-ai-telemetry

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifacts
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/briefcase-ai-telemetry.exe artifacts/${{ matrix.artifact-name }}
          else
            cp target/${{ matrix.target }}/release/briefcase-ai-telemetry artifacts/${{ matrix.artifact-name }}
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: artifacts/${{ matrix.artifact-name }}

  # Note: Rust crate publishing disabled for BSL licensed code
  # publish-crates:
  #   name: Publish to crates.io (DISABLED - BSL License)
  #   runs-on: ubuntu-latest
  #   needs: [validate, test-python]
  #   steps:
  #     - name: Skip crates.io publishing
  #       run: |
  #         echo "⚠️  Skipping crates.io publishing due to BSL 1.1 license"
  #         echo "📝 BSL licensed code cannot be published to public registries"

  # Note: PyPI publishing disabled for BSL licensed code
  # publish-pypi:
  #   name: Publish to PyPI (DISABLED - BSL License)
  #   runs-on: ubuntu-latest
  #   needs: [build-wheels, build-sdist]
  #   steps:
  #     - name: Skip PyPI publishing
  #       run: |
  #         echo "⚠️  Skipping PyPI publishing due to BSL 1.1 license"
  #         echo "📝 BSL licensed code distributed via private GitHub releases only"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build-binaries, build-wheels, build-sdist]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: wheels

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp artifacts/* release-assets/ 2>/dev/null || echo "No binary artifacts"
          cp wheels/* release-assets/ 2>/dev/null || echo "No wheel artifacts"

          # Create installation guide
          cat > release-assets/INSTALL.md << 'EOF'
          # Briefcase AI Telemetry SDK - Private Release

          **License**: Business Source License 1.1
          **Distribution**: Private GitHub releases only

          ## Installation Options

          ### Option 1: Install from wheel (recommended)
          Download the appropriate wheel for your platform:
          ```bash
          pip install briefcase_ai_telemetry-*-py3-none-*.whl
          ```

          ### Option 2: Install from git
          ```bash
          pip install git+https://github.com/briefcasebrain/briefcase-ai-telemetry-sdk.git
          ```

          ## Platform Support
          - Linux (x86_64, aarch64)
          - macOS (Intel, Apple Silicon)
          - Windows (x86_64)
          - Python 3.9+

          ## Verification
          ```python
          import briefcase_ai_telemetry
          print("Installation successful!")
          ```

          ## License Agreement
          By downloading and using this software, you agree to the BSL 1.1 license terms.
          Commercial use restrictions apply. See LICENSE file for details.

          ## Support
          For support, contact: support@briefcasebrain.com
          EOF

      - name: List release assets
        run: ls -la release-assets/

      - name: Generate release notes
        id: release-notes
        run: |
          if [[ -f CHANGELOG.md ]]; then
            awk "/^## \[${{ needs.validate.outputs.version }}\]/,/^## \[/" CHANGELOG.md | head -n -1 > release-notes.md
            if [[ -s release-notes.md ]]; then
              echo "Found changelog entry"
              cat release-notes.md
            else
              echo "## Changes in ${{ needs.validate.outputs.tag }}" > release-notes.md
              echo "See [full changelog](CHANGELOG.md) for details." >> release-notes.md
            fi
          else
            echo "## Release ${{ needs.validate.outputs.tag }}" > release-notes.md
            echo "This release includes improvements and bug fixes." >> release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Briefcase AI Telemetry SDK ${{ needs.validate.outputs.tag }}
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [validate, create-release]
    if: always()
    steps:
      - name: Notify success
        if: needs.create-release.result == 'success'
        run: |
          echo "🎉 Successfully released ${{ needs.validate.outputs.tag }}"
          echo "📦 Private release available on:"
          echo "  - GitHub Releases: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}"
          echo ""
          echo "📋 Installation:"
          echo "  pip install git+https://github.com/${{ github.repository }}.git@${{ needs.validate.outputs.tag }}"
          echo ""
          echo "📄 License: Business Source License 1.1"

      - name: Notify failure
        if: needs.create-release.result == 'failure'
        run: |
          echo "❌ Release ${{ needs.validate.outputs.tag }} failed"
          echo "Please check the workflow logs and retry if necessary"
          exit 1