name: Publish to Private PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing version: ${VERSION#v}"

      - name: Validate version format
        run: |
          if ! [[ "${{ steps.version.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Invalid version format: ${{ steps.version.outputs.version }}"
            exit 1
          fi

  build-and-publish:
    name: Build and Publish to Private PyPI
    runs-on: ${{ matrix.os }}
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: publish-${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            pip install maturin twine
          else
            pip install maturin[patchelf] twine
          fi
        shell: bash

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --manifest-path crates/briefcase-ai-telemetry/Cargo.toml
          sccache: 'true'
          manylinux: auto
          before-script-linux: |
            # Install system dependencies for cross-compilation
            if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
              export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            fi

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          retention-days: 30

      - name: Publish to Private PyPI
        if: success()
        env:
          TWINE_USERNAME: ${{ secrets.PRIVATE_PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PRIVATE_PYPI_PASSWORD }}
          TWINE_REPOSITORY_URL: ${{ secrets.PRIVATE_PYPI_URL }}
        run: |
          echo "📦 Publishing wheels to private PyPI repository..."

          # Validate environment variables
          if [[ -z "$TWINE_USERNAME" || -z "$TWINE_PASSWORD" || -z "$TWINE_REPOSITORY_URL" ]]; then
            echo "❌ Missing required secrets for private PyPI:"
            echo "   - PRIVATE_PYPI_USERNAME"
            echo "   - PRIVATE_PYPI_PASSWORD"
            echo "   - PRIVATE_PYPI_URL"
            exit 1
          fi

          # List wheels to be published
          echo "🔍 Wheels to publish:"
          ls -la dist/

          # Publish to private PyPI
          echo "🚀 Publishing to $TWINE_REPOSITORY_URL"
          python -m twine upload dist/*.whl \
            --repository-url "$TWINE_REPOSITORY_URL" \
            --username "$TWINE_USERNAME" \
            --password "$TWINE_PASSWORD" \
            --verbose \
            --non-interactive

          echo "✅ Successfully published wheels to private PyPI!"
        shell: bash

  build-source-distribution:
    name: Build Source Distribution
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin[patchelf] twine

      - name: Build source distribution
        run: |
          maturin sdist --out dist --manifest-path crates/briefcase-ai-telemetry/Cargo.toml

      - name: Upload source distribution as artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          retention-days: 30

      - name: Publish source distribution to Private PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PRIVATE_PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PRIVATE_PYPI_PASSWORD }}
          TWINE_REPOSITORY_URL: ${{ secrets.PRIVATE_PYPI_URL }}
        run: |
          echo "📦 Publishing source distribution to private PyPI..."

          if [[ -z "$TWINE_USERNAME" || -z "$TWINE_PASSWORD" || -z "$TWINE_REPOSITORY_URL" ]]; then
            echo "❌ Missing required secrets for private PyPI"
            exit 1
          fi

          echo "🔍 Source distribution:"
          ls -la dist/

          python -m twine upload dist/*.tar.gz \
            --repository-url "$TWINE_REPOSITORY_URL" \
            --username "$TWINE_USERNAME" \
            --password "$TWINE_PASSWORD" \
            --verbose \
            --non-interactive

          echo "✅ Successfully published source distribution!"

  notify-success:
    name: Notify Publication Success
    runs-on: ubuntu-latest
    needs: [validate-release, build-and-publish, build-source-distribution]
    if: success()
    steps:
      - name: Success notification
        run: |
          echo "🎉 Successfully published briefcase-ai-telemetry ${{ needs.validate-release.outputs.tag }} to private PyPI!"
          echo ""
          echo "📦 Package Information:"
          echo "  - Version: ${{ needs.validate-release.outputs.version }}"
          echo "  - Tag: ${{ needs.validate-release.outputs.tag }}"
          echo "  - Repository: ${{ secrets.PRIVATE_PYPI_URL }}"
          echo ""
          echo "📋 Installation Instructions:"
          echo "  pip install --index-url ${{ secrets.PRIVATE_PYPI_URL }}/simple/ briefcase-ai-telemetry"
          echo ""
          echo "🔐 Users will need authentication credentials to install"
          echo "📧 Contact: support@briefcasebrain.com for access"

  notify-failure:
    name: Notify Publication Failure
    runs-on: ubuntu-latest
    needs: [validate-release, build-and-publish, build-source-distribution]
    if: failure()
    steps:
      - name: Failure notification
        run: |
          echo "❌ Failed to publish briefcase-ai-telemetry ${{ needs.validate-release.outputs.tag }}"
          echo "🔍 Check the workflow logs for details"
          echo "🛠️ Common issues:"
          echo "  - Authentication credentials incorrect"
          echo "  - Private PyPI server unavailable"
          echo "  - Version already exists"
          echo "  - Build errors on specific platforms"
          exit 1